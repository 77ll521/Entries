<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营销文案模板库 · 制造企业文案助手</title>
<link rel="stylesheet" href="styles.css">
<style>
  .lib-wrap { max-width: 1240px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-left: 24px; padding-right: 24px; }
  .lib-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
  .lib-search { flex: 1 1 220px; min-width: 160px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
  .lib-select { border: 1px solid #cbd5e1; border-radius: 6px; padding: 7px 10px; font-family: inherit; font-size: 13.5px; }
  .lib-count { font-size: 13px; color: #64748b; margin-left: auto; }
  .lib-main { display: flex; gap: 14px; flex: 1; flex-wrap: wrap; }
  .lib-list { flex: 1 1 420px; min-width: 300px; }
  .lib-cards { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 74vh; overflow: auto; padding-right: 4px; }
  .lib-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .lib-card:hover { border-color: #93b4e8; box-shadow: 0 2px 8px rgba(37,99,235,.08); }
  .lib-card.sel { border-color: #2563eb; background: #f0f6ff; }
  .lib-card-title { font-weight: 700; color: #1f3a5f; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .lib-tag { font-size: 11.5px; background: #eef2ff; color: #3b5bdb; border-radius: 10px; padding: 1px 8px; font-weight: 400; }
  .lib-card-sub { font-size: 12.5px; color: #64748b; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-detail { flex: 1 1 520px; min-width: 320px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }
  .lib-empty { color: #94a3b8; text-align: center; padding: 40px 0; }
  .lib-detail-h { font-weight: 700; color: #1f3a5f; font-size: 16px; margin-bottom: 4px; }
  .lib-detail-meta { font-size: 12.5px; color: #64748b; margin-bottom: 10px; }
  .sec-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .sec-tab { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; font-family: inherit; color: #475569; }
  .sec-tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .sec-body { flex: 1; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px 12px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; background: #fbfdff; min-height: 220px; max-height: 46vh; overflow: auto; }
  .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .lib-foot { text-align: center; padding: 8px 16px 14px; font-size: 11.5px; color: #b0b7c3; }
  .loadmore { text-align: center; padding: 10px; }
</style>
</head>
<body>
<div class="lib-wrap">
  <header class="topbar">
    <div class="brand">
      <span class="logo">📚</span>
      <span class="title">营销文案模板库</span>
      <span class="badge badge-basic" id="libBadge">加载中…</span>
      <span class="title-sub">面向山东本土装备制造企业，针对机床零部件快速生成多渠道营销文案</span>
    </div>
    <div class="top-actions">
      <a href="index.html" class="btn btn-ghost">← 返回文案助手</a>
      <button id="btnExportAll" class="btn btn-ghost">📦 导出全部模板</button>
    </div>
  </header>

  <div class="lib-toolbar">
    <input id="libSearch" class="lib-search" placeholder="🔍 搜索产品名 / 材质 / 关键词（如：车床、不锈钢、密封圈）" autocomplete="off">
    <select id="libIndustry" class="lib-select"><option value="">全部行业</option></select>
    <span id="libCount" class="lib-count"></span>
  </div>

  <div class="lib-main">
    <div class="lib-list">
      <div id="libCards" class="lib-cards"></div>
      <div id="libLoadmore" class="loadmore" style="display:none">
        <button id="btnLoadmore" class="btn btn-ghost">加载更多…</button>
      </div>
    </div>
    <div class="lib-detail" id="libDetail">
      <div class="lib-empty">← 从左侧选择一条产品，查看它的六段文案模板</div>
    </div>
  </div>
  <div class="page-disclaimer">
    <p>本页面为2026山东省首届大学生AI大模型创新传播大赛评审演示版本，仅用于赛事原创性核验，作品知识产权归参赛团队所有，禁止商用、复刻参赛。</p>
    <p>仅开放自研核心业务代码用于评审，不含密钥等敏感配置。</p>
  </div>
</div>

<!-- 左右两侧竖排赛事水印 -->
<div class="contest-side contest-left">本页面为2026山东省首届大学生AI大模型创新传播大赛评审演示版本</div>
<div class="contest-side contest-right">本页面为2026山东省首届大学生AI大模型创新传播大赛评审演示版本</div>

<script src="templates.js"></script>
<script src="library.js"></script>
<script src="library_app.js"></script>
</body>
</html>
